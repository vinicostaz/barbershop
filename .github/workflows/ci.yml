name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barbershop_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barbershop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barbershop_test
      JWT_SECRET: chave-exclusiva-do-ambiente-de-ci
      NODE_ENV: test
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Validar schema Prisma
        run: npx prisma validate
      - name: Gerar Prisma Client
        run: npm run prisma:generate
      - name: Aplicar migrações
        run: npm run prisma:migrate
      - name: Verificar tipos
        run: npm run typecheck
      - name: Executar testes unitários
        run: npm test
      - name: Executar testes de integração
        run: |
          npm run test:concorrencia
          npm run test:fila
          npm run test:concluir
          npm run test:notificacoes
          npm run test:avaliacoes

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Executar lint
        run: npm run lint
      - name: Gerar build
        run: npm run build
